# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Android
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.injected.build.model.only.versioned = 3

# AGP 9.0: keep classic DSL / external Kotlin compiler to stay compatible with Kotlin 2.2.x + KSP
android.newDsl=false
android.builtInKotlin=false

org.gradle.parallel=true
org.gradle.caching=true

# Proxy for dependency/plugin resolution (sandbox egress via 127.0.0.1:18080)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1